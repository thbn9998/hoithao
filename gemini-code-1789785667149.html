<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tham gia Hội thao THACO AUTO 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="max-w-6xl mx-auto p-4 md:p-8 flex flex-col md:flex-row gap-8 mt-10 bg-white shadow-xl rounded-lg">
        
        <!-- Cột trái: Hình ảnh thông báo và bảng size -->
        <div class="w-full md:w-1/2">
            <h1 class="text-2xl font-bold text-[#003b7e] uppercase mb-4 text-center md:text-left">
                THACO AUTO BẮC NINH
            </h1>
            <p class="text-[17px] font-bold text-[#003b7e] mb-2">Kính chào Quý Anh/Chị đăng ký tham gia Hội thao năm 2026 do THACO AUTO Bắc Ninh tổ chức</p>
            <p class="text-[17px] font-bold text-[#003b7e] mb-2">Thời gian dự kiến: <span class="text-red-600">Thứ 7, ngày 7 tháng 11 năm 2026</span></p>
            
            <!-- Bạn dán link Google Map thật vào phần href="..." dưới đây -->
            <p class="text-[17px] font-bold text-[#003b7e] mb-2">Địa điểm dự kiến: <a href="https://maps.app.goo.gl/Thay-Link-Map-Cua-Ban-Vao-Day" target="_blank" class="text-red-600 underline hover:text-red-800">Link map</a></p>
            
            <p class="text-[17px] font-bold text-[#003b7e] mb-6">Quý Anh/Chị đăng ký thông tin để chương trình diễn ra thành công nhé!</p>
            
            <!-- Đã đổi tên file ảnh để bạn tự up lên GitHub -->
            <img src="bang-size.jpg" alt="Bảng size áo và Thư mời" class="w-full border rounded">
        </div>

        <!-- Cột phải: Form đăng ký -->
        <div class="w-full md:w-1/2 flex flex-col justify-center">
            <h2 class="text-2xl font-bold text-[#003b7e] uppercase mb-6 text-center">ĐĂNG KÝ THAM GIA</h2>
            
            <form id="registerForm" class="space-y-4">
                <div>
                    <label class="block font-bold text-[#003b7e] mb-1 text-lg">Showroom:</label>
                    <select id="showroom" class="w-full p-2 border border-gray-400 rounded focus:ring-2 focus:ring-[#003b7e]" required>
                        <option value="">-- Chọn Showroom --</option>
                        <option value="Bắc Ninh">Bắc Ninh</option>
                        <option value="Bắc Giang">Bắc Giang</option>
                        <option value="Lạng Sơn">Lạng Sơn</option>
                    </select>
                </div>

                <div>
                    <label class="block font-bold text-[#003b7e] mb-1 text-lg">Mã số nhân viên:</label>
                    <input type="text" id="masonhanvien" placeholder="VD: 123456" class="w-full p-2 border border-gray-400 rounded focus:ring-2 focus:ring-[#003b7e]" required>
                </div>

                <div>
                    <label class="block font-bold text-[#003b7e] mb-1 text-lg">Họ tên:</label>
                    <input type="text" id="hoten" placeholder="Nhập họ và tên" class="w-full p-2 border border-gray-400 rounded focus:ring-2 focus:ring-[#003b7e]" required>
                </div>

                <div>
                    <label class="block font-bold text-[#003b7e] mb-1 text-lg">Giới tính:</label>
                    <select id="gioitinh" class="w-full p-2 border border-gray-400 rounded focus:ring-2 focus:ring-[#003b7e]" required>
                        <option value="">-- Chọn Giới tính --</option>
                        <option value="Nam">Nam</option>
                        <option value="Nữ">Nữ</option>
                    </select>
                </div>

                <div>
                    <label class="block font-bold text-[#003b7e] mb-1 text-lg">Size áo:</label>
                    <select id="size" class="w-full p-2 border border-gray-400 rounded focus:ring-2 focus:ring-[#003b7e]" required>
                        <option value="">-- Chọn Size áo --</option>
                        <option value="S">S</option>
                        <option value="M">M</option>
                        <option value="L">L</option>
                        <option value="XL">XL</option>
                        <option value="XXL">XXL</option>
                        <option value="3XL">3XL</option>
                        <option value="4XL">4XL</option>
                    </select>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-[#003b7e] text-white font-bold py-3 px-4 rounded hover:bg-blue-900 transition duration-300 mt-4">
                    GỬI ĐĂNG KÝ
                </button>
            </form>
        </div>
    </div>

    <!-- Hộp thoại thông báo -->
    <div id="successModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-lg shadow-2xl text-center max-w-sm w-full mx-4">
            <div class="text-green-600 text-6xl mb-4">✔</div>
            <h3 class="text-2xl font-bold text-[#003b7e] mb-2">Thành công!</h3>
            <p id="successMessage" class="text-gray-700 mb-6 font-medium"></p>
            <button onclick="closeModal()" class="bg-[#003b7e] text-white px-8 py-2 rounded-full font-bold hover:bg-blue-900 transition">Đóng</button>
        </div>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbw6acJtYFl2ohVkCDI5ErmeJJNWI8sSrU1PZmiNyv3DyKqMaYR51BjnylTzLTa8U-ICgg/exec';

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.innerText;
            submitBtn.innerText = 'ĐANG XỬ LÝ...';
            submitBtn.disabled = true;

            const formData = {
                showroom: document.getElementById('showroom').value,
                masonhanvien: document.getElementById('masonhanvien').value,
                hoten: document.getElementById('hoten').value,
                gioitinh: document.getElementById('gioitinh').value,
                size: document.getElementById('size').value
            };

            // Đã thêm headers text/plain để sửa lỗi CORS chặn kết nối
            fetch(WEB_APP_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8',
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                if(data.status === 'success') {
                    document.getElementById('successMessage').innerText = `Cảm ơn Anh/Chị ${formData.hoten} đã đăng ký thành công!`;
                    document.getElementById('successModal').classList.remove('hidden');
                    document.getElementById('registerForm').reset();
                } else {
                    alert('Lỗi từ Google Sheets: ' + data.message);
                }
            })
            .catch(error => {
                alert('Có lỗi xảy ra, vui lòng thử lại! Lỗi: ' + error.message);
            })
            .finally(() => {
                submitBtn.innerText = originalText;
                submitBtn.disabled = false;
            });
        });

        function closeModal() {
            document.getElementById('successModal').classList.add('hidden');
        }
    </script>
</body>
</html>
